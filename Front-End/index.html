<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>EVENT HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
<section class="customer-section">
    <!-- event form -->
    <div class="customer-form d-flex justify-content-center">
        <div class="card m-3" style="width: 35rem;">
            <div class="card-body">
                <form class="row g-3 needs-validation" novalidate>
                    <div class="col-md-12">
                        <label for="eventId" class="form-label">Event ID</label>
                        <input type="text" class="form-control" id="eventId" required>
                    </div>
                    <div class="col-md-6">
                        <label for="eventName" class="form-label">Event Name</label>
                        <input type="text" class="form-control" id="eventName" required>
                        <div class="valid-feedback">
                            Looks good!
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="eventDescription" class="form-label">Event Description</label>
                        <input type="text" class="form-control" id="eventDescription" required>
                        <div class="valid-feedback">
                            Looks good!
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="eventDate" class="form-label">Event Date</label>
                        <input type="date" class="form-control" id="eventDate" required>
                        <div class="valid-feedback">
                            Looks good!
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="eventPlace" class="form-label">Event Place</label>
                        <input type="text" class="form-control" id="eventPlace" required>
                        <div class="invalid-feedback">
                            Please provide a valid address.
                        </div>
                    </div>
                    <div class="col-12 d-flex justify-content-center">
                        <button class="btn btn-primary" type="submit" id="btnRegister">Register</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="main-card-div" class="d-flex flex-wrap justify-content-center">
        <!-- Cards will be dynamically added here -->
<!--        <div class="card m-1" style="width: 20rem;">-->

<!--                <li class="list-group-item">Name: ${res.eid}</li>-->
<!--                <li class="list-group-item">Description: ${res.eid}</li>-->
<!--                <li class="list-group-item">Date: ${res.eid}</li>-->
<!--                <li class="list-group-item">Place: ${res.eid}</li>-->
<!--            </ul>-->
<!--        </div>-->
    </div>
</section>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="index.js"></script>
</body>
</html>
